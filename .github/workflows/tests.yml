name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Upgrading DIAMOND means changing both values (spec 15).
  DIAMOND_VERSION: "2.2.9"
  DIAMOND_SHA256: "cb0cf1a14b7254e624934a247665605b7d73991c83319337b36c5a827b1d6622"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore DIAMOND
        id: diamond-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/diamond
          key: diamond-${{ runner.os }}-${{ env.DIAMOND_VERSION }}-${{ env.DIAMOND_SHA256 }}
      - name: Download DIAMOND
        if: steps.diamond-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/diamond
          curl -sSfL -o diamond.tar.gz \
            "https://github.com/bbuchfink/diamond/releases/download/v${DIAMOND_VERSION}/diamond-linux64.tar.gz"
          echo "${DIAMOND_SHA256}  diamond.tar.gz" | sha256sum -c -
          tar -xzf diamond.tar.gz -C ~/diamond diamond
      - name: Put DIAMOND on PATH
        run: |
          echo "$HOME/diamond" >> "$GITHUB_PATH"
          "$HOME/diamond/diamond" version
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        env:
          HOMOLOCUS_REQUIRE_DIAMOND: "1"
        run: pytest --cov=homolocus --cov-report=term-missing
