name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs every check and publishes the distributions built here.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Upgrading DIAMOND means changing both values (spec 15).
  DIAMOND_VERSION: "2.2.9"
  DIAMOND_SHA256: "cb0cf1a14b7254e624934a247665605b7d73991c83319337b36c5a827b1d6622"
  # macOS has no official DIAMOND build, so it comes from Bioconda (spec 15).
  DIAMOND_BUILD: "h5b4e277_0"
  MICROMAMBA_VERSION: "2.10.0-0"
  MICROMAMBA_SHA256: "c547639f5caf742236641c362746abb4a3505774753ecd08fe341643670c4c01"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src

  test:
    name: Tests (Python ${{ matrix.python-version }}${{ matrix.deps == 'minimum' && ', minimum versions' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: [latest]
        include:
          # The dependency floors in pyproject.toml, installed exactly (spec 15).
          - python-version: "3.10"
            deps: minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore DIAMOND
        id: diamond-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/diamond
          key: diamond-${{ runner.os }}-${{ env.DIAMOND_VERSION }}-${{ env.DIAMOND_SHA256 }}
      - name: Download DIAMOND
        if: steps.diamond-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/diamond
          curl -sSfL -o diamond.tar.gz \
            "https://github.com/bbuchfink/diamond/releases/download/v${DIAMOND_VERSION}/diamond-linux64.tar.gz"
          echo "${DIAMOND_SHA256}  diamond.tar.gz" | sha256sum -c -
          tar -xzf diamond.tar.gz -C ~/diamond diamond
      - name: Put DIAMOND on PATH
        run: |
          echo "$HOME/diamond" >> "$GITHUB_PATH"
          "$HOME/diamond/diamond" version
      - name: Install
        if: matrix.deps == 'latest'
        run: python -m pip install -e ".[dev]"
      - name: Install minimum versions
        if: matrix.deps == 'minimum'
        run: |
          python -m pip install --no-deps -e .
          python - > floors.txt <<'EOF'
          from importlib.metadata import requires

          for requirement in requires("homolocus"):
              if "extra ==" not in requirement:
                  print(requirement.replace(">=", "=="))
          print("numpy<2")  # pandas 2.0 is built against NumPy 1
          EOF
          cat floors.txt
          python -m pip install -e . pytest pytest-cov hypothesis -c floors.txt
          python -m pip list
      - name: Pytest
        env:
          HOMOLOCUS_REQUIRE_DIAMOND: "1"
        run: pytest --cov=homolocus --cov-report=term-missing

  test-macos:
    name: Tests (macOS, Python 3.13)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore DIAMOND
        id: diamond-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/diamond-macos
          key: diamond-${{ runner.os }}-${{ env.DIAMOND_VERSION }}-${{ env.DIAMOND_BUILD }}-${{ env.MICROMAMBA_VERSION }}
      - name: Install DIAMOND from Bioconda
        if: steps.diamond-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/diamond-macos
          curl -sSfL -o micromamba \
            "https://github.com/mamba-org/micromamba-releases/releases/download/${MICROMAMBA_VERSION}/micromamba-osx-arm64"
          echo "${MICROMAMBA_SHA256}  micromamba" | shasum -a 256 -c -
          chmod +x micromamba
          ./micromamba create -y -p ~/diamond-macos/env -c conda-forge -c bioconda \
            "diamond=${DIAMOND_VERSION}=${DIAMOND_BUILD}"
      - name: Put DIAMOND on PATH
        run: |
          echo "$HOME/diamond-macos/env/bin" >> "$GITHUB_PATH"
          "$HOME/diamond-macos/env/bin/diamond" version
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        env:
          HOMOLOCUS_REQUIRE_DIAMOND: "1"
        run: pytest --cov=homolocus --cov-report=term-missing

  build:
    name: Build and check distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Check wheel contents
        run: |
          python - <<'EOF'
          import pathlib
          import zipfile

          (wheel,) = pathlib.Path("dist").glob("*.whl")
          names = set(zipfile.ZipFile(wheel).namelist())
          package = pathlib.Path("src")
          sources = {p.relative_to(package).as_posix() for p in package.rglob("*.py")}
          assert sources <= names, sorted(sources - names)
          assert "homolocus/py.typed" in names
          assert not [n for n in names if n.startswith("tests/")]
          print(f"{wheel.name}: {len(names)} files")
          EOF
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/clean/bin/homolocus" --help
          "$RUNNER_TEMP/clean/bin/homolocus" find --help > /dev/null
          "$RUNNER_TEMP/clean/bin/python" -c "import homolocus; print(homolocus.RegionFinder)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
